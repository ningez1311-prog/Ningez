name: Screener

# GitHub rechnet in UTC. Je Region zwei Startzeiten, damit Sommer- und Winterzeit
# abgedeckt sind – das Skript prüft selbst, ob die Börse schon geschlossen hat,
# und läuft pro Handelstag nur einmal.
on:
  schedule:
    - cron: "50 15 * * 1-5"   # DE: 17:50 Sommerzeit
    - cron: "50 16 * * 1-5"   # DE: 17:50 Winterzeit
    - cron: "20 20 * * 1-5"   # US: 22:20 Berlin (Sommerzeit)
    - cron: "20 21 * * 1-5"   # US: 22:20 Berlin (Winterzeit)
  workflow_dispatch:
    inputs:
      region:
        description: "Region"
        type: choice
        options: [de, us]
        default: de
      force:
        description: "Zeitprüfung überspringen (Testlauf)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Region bestimmen
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "REGION=${{ inputs.region }}" >> $GITHUB_ENV
            [ "${{ inputs.force }}" = "true" ] && echo "FORCE=--force" >> $GITHUB_ENV || true
          else
            case "${{ github.event.schedule }}" in
              "50 15 * * 1-5"|"50 16 * * 1-5") echo "REGION=de" >> $GITHUB_ENV ;;
              *) echo "REGION=us" >> $GITHUB_ENV ;;
            esac
          fi

      - name: Screener
        run: python -m screener.run --region "$REGION" $FORCE

      - name: Ergebnisse speichern
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add data signals
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Screener $REGION $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
